<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MeshForge">
  <defs>
    <linearGradient id="heat" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD37A"/>
      <stop offset="0.45" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#E8336D"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141925"/>
      <stop offset="1" stop-color="#0B0E16"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#tile)" stroke="#272E3F" stroke-width="1.5"/>

  <!-- Faceted crystal (low-poly mesh + forge heat) -->
  <g filter="url(#glow)">
    <!-- facets -->
    <polygon points="64,16 26,44 64,50" fill="url(#heat)" opacity="0.92"/>
    <polygon points="64,16 64,50 102,44" fill="url(#heat)" opacity="0.78"/>
    <polygon points="26,44 64,50 64,84 38,86" fill="url(#heat)" opacity="0.5"/>
    <polygon points="64,50 102,44 90,86 64,84" fill="url(#heat)" opacity="0.62"/>
    <polygon points="38,86 64,84 64,112" fill="url(#heat)" opacity="0.34"/>
    <polygon points="64,84 90,86 64,112" fill="url(#heat)" opacity="0.44"/>

    <!-- wire edges -->
    <g stroke="#FFE7C4" stroke-width="1.4" stroke-linejoin="round" opacity="0.85" fill="none">
      <polygon points="64,16 26,44 38,86 64,112 90,86 102,44"/>
      <path d="M64,16 L64,50 M26,44 L64,50 L102,44 M64,50 L64,84 M38,86 L64,84 L90,86 M64,84 L64,112"/>
    </g>

    <!-- vertex nodes -->
    <g fill="#FFF3E0">
      <circle cx="64" cy="16" r="2.6"/>
      <circle cx="26" cy="44" r="2.6"/>
      <circle cx="102" cy="44" r="2.6"/>
      <circle cx="38" cy="86" r="2.6"/>
      <circle cx="90" cy="86" r="2.6"/>
      <circle cx="64" cy="112" r="2.6"/>
      <circle cx="64" cy="50" r="2.2" fill="#FFD37A"/>
      <circle cx="64" cy="84" r="2.2" fill="#FF6B35"/>
    </g>
  </g>
</svg>
