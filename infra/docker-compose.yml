# ============================================================
# MeshForge — infraestrutura de apoio (plano de controle)
# Sobe Postgres + Redis + MinIO. Serviços de GPU rodam NATIVOS
# no Windows (ZLUDA) e não fazem parte deste compose.
# ============================================================
name: meshforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: meshforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meshforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meshforge}
      POSTGRES_DB: ${POSTGRES_DB:-meshforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meshforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meshforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: meshforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meshforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-meshforge123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket inicial e encerra.
  minio-init:
    image: minio/mc:latest
    container_name: meshforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-meshforge} ${MINIO_ROOT_PASSWORD:-meshforge123};
      mc mb --ignore-existing local/${S3_BUCKET:-meshforge};
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
